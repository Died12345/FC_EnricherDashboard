<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>500 Vragen — Jachtopleiding Quiz</title>
<style>
  :root {
    --bg: #f5f6fa;
    --surface: #ffffff;
    --surface2: #f0f2f7;
    --border: #dde1ec;
    --text: #111827;
    --muted: #6b7280;
    --accent: #4f5de8;
    --accent-hover: #3d4bd6;
    --success: #16a34a;
    --success-bg: rgba(22,163,74,0.12);
    --danger: #dc2626;
    --danger-bg: rgba(220,38,38,0.12);
    --radius: 10px;
    --radius-sm: 6px;
  }
  :root.dark {
    --bg: #0d0f14;
    --surface: #161923;
    --surface2: #1e2330;
    --border: #252a38;
    --text: #e2e8f0;
    --muted: #8893a8;
    --accent: #5b6ef5;
    --accent-hover: #7b8ff7;
    --success: #22c55e;
    --success-bg: rgba(34,197,94,0.18);
    --danger: #ef4444;
    --danger-bg: rgba(239,68,68,0.18);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.55;
    padding: 1.5rem;
    min-height: 100vh;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 1.25rem; gap: 1rem; flex-wrap: wrap;
  }
  header h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: -0.01em; }
  header p { color: var(--muted); font-size: 0.78rem; margin-top: 0.15rem; }
  .ctrls { display: flex; gap: 0.4rem; flex-wrap: wrap; }
  .ctrl-btn {
    background: none; border: 1px solid var(--border);
    border-radius: var(--radius-sm); color: var(--muted);
    cursor: pointer; font-size: 0.78rem; padding: 0.35rem 0.7rem;
    transition: all 0.15s; font-family: inherit;
  }
  .ctrl-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* Progress bar */
  .progress {
    height: 6px; background: var(--surface2); border-radius: 999px;
    overflow: hidden; margin-bottom: 1rem;
  }
  .progress-bar {
    height: 100%; background: var(--accent);
    transition: width 0.25s ease;
  }

  /* Stats row */
  .stats {
    display: flex; gap: 0.75rem; margin-bottom: 1rem;
    font-size: 0.78rem; color: var(--muted);
  }
  .stat-pill {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 999px; padding: 0.25rem 0.7rem;
  }
  .stat-pill b { color: var(--text); }
  .stat-pill.good b { color: var(--success); }
  .stat-pill.bad  b { color: var(--danger); }

  /* Question card */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 1.25rem 1.25rem 1rem;
    margin-bottom: 1rem;
  }
  .qnum {
    font-size: 0.7rem; color: var(--muted); font-weight: 600;
    letter-spacing: 0.06em; text-transform: uppercase;
  }
  .qtext {
    font-size: 1rem; font-weight: 500; margin: 0.4rem 0 1rem;
    color: var(--text);
  }

  .opt {
    display: flex; align-items: flex-start; gap: 0.6rem;
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 0.7rem 0.85rem; margin-bottom: 0.5rem;
    cursor: pointer; transition: all 0.15s;
    background: var(--surface);
  }
  .opt:hover { border-color: var(--accent); background: var(--surface2); }
  .opt input { margin-top: 0.25rem; flex-shrink: 0; accent-color: var(--accent); }
  .opt-label { font-weight: 600; color: var(--muted); margin-right: 0.15rem; flex-shrink: 0; }
  .opt-text { flex: 1; }
  .opt.selected { border-color: var(--accent); background: var(--surface2); }
  .opt.correct {
    border-color: var(--success); background: var(--success-bg); color: var(--text);
  }
  .opt.correct .opt-label { color: var(--success); }
  .opt.wrong {
    border-color: var(--danger); background: var(--danger-bg); color: var(--text);
  }
  .opt.wrong .opt-label { color: var(--danger); }

  /* Action row */
  .actions {
    display: flex; align-items: center; gap: 0.5rem;
    margin-top: 1rem; flex-wrap: wrap;
  }
  .btn {
    border: none; border-radius: var(--radius-sm); cursor: pointer;
    font-size: 0.85rem; font-weight: 500; padding: 0.55rem 1rem;
    transition: all 0.15s; font-family: inherit;
  }
  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-secondary {
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

  .feedback {
    margin-left: auto; font-size: 0.85rem; font-weight: 500;
  }
  .feedback.good { color: var(--success); }
  .feedback.bad  { color: var(--danger); }

  /* Jump bar */
  .jump {
    display: flex; gap: 0.5rem; align-items: center;
    margin-top: 0.5rem; font-size: 0.8rem; color: var(--muted);
  }
  .jump input {
    width: 70px; padding: 0.3rem 0.5rem;
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: var(--surface); color: var(--text); font-family: inherit;
  }

  /* Summary view */
  .summary {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 1.25rem;
    text-align: center; margin-bottom: 1rem;
  }
  .summary h2 { font-size: 1.4rem; margin-bottom: 0.5rem; }
  .summary .score { font-size: 2.5rem; font-weight: 700; color: var(--accent); }
  .summary .score-detail { color: var(--muted); margin-bottom: 1rem; }

  footer {
    margin-top: 1.5rem; color: var(--muted);
    font-size: 0.7rem; text-align: center;
  }
  footer a { color: var(--muted); }

  @media (max-width: 600px) {
    body { padding: 1rem; }
    header h1 { font-size: 1rem; }
    .stats { font-size: 0.72rem; }
  }
</style>
</head>
<body>
<div class="wrap">

<header>
  <div>
    <h1>500 Vragen — Jachtopleiding</h1>
    <p>Stichting Jachtopleidingen Nederland · Uitgave 2009</p>
  </div>
  <div class="ctrls">
    <button class="ctrl-btn" id="theme-toggle" onclick="toggleTheme()">Dark</button>
    <button class="ctrl-btn" onclick="resetAll()">Reset</button>
    <button class="ctrl-btn" onclick="toggleShuffle()" id="shuffle-btn">Shuffle: off</button>
  </div>
</header>

<div class="progress"><div class="progress-bar" id="bar" style="width:0%"></div></div>

<div class="stats">
  <span class="stat-pill"><b id="pos">1</b> / <span id="total">500</span></span>
  <span class="stat-pill good">Juist: <b id="correct-count">0</b></span>
  <span class="stat-pill bad">Fout: <b id="wrong-count">0</b></span>
  <span class="stat-pill">Gemaakt: <b id="answered-count">0</b></span>
</div>

<div id="question-area"></div>

<div class="actions">
  <button class="btn btn-secondary" onclick="prev()" id="prev-btn">← Vorige</button>
  <button class="btn btn-primary" onclick="check()" id="check-btn">Controleer</button>
  <button class="btn btn-secondary" onclick="next()" id="next-btn">Volgende →</button>
  <span class="feedback" id="feedback"></span>
</div>

<div class="jump">
  Spring naar:
  <input type="number" id="jump-input" min="1" max="500" placeholder="1-500">
  <button class="ctrl-btn" onclick="jumpTo()">Ga</button>
  <span style="margin-left:auto;" id="show-summary-link">
    <button class="ctrl-btn" onclick="showSummary()">Overzicht</button>
  </span>
</div>

<footer>
  Toetsenbord: <b>1/A</b>, <b>2/B</b>, <b>3/C</b> om te kiezen · <b>Enter</b> controleer · <b>←/→</b> navigeer
</footer>

</div>

": "Hondsdolheid", "ans": "c"}, {"n": 496, "q": "Pointers en setters zijn in de eerste plaats bedoeld voor het bejagen van", "a": "veerwild", "b": "veerwild en haarwild", "c": "veerwild en waterwild", "ans": "a"}, {"n": 497, "q": "Schade door duiven en eenden kan het beste worden bestreden door de dieren op de", "a": "schadeplek te bejagen", "b": "slaapplaatsen te bejagen", "c": "aanvliegroutes te bejagen", "ans": "b"}, {"n": 498, "q": "Wildschade in suikerbieten", "a": "kan in elk groeistadium voorkomen", "b": "is voornamelijk te verwachten wanneer de bieten oogstrijp zijn", "c": "is vooral te vrezen wanneer het kiemende plantje gaat groeien Onweidelijk is", "ans": "c"}, {"n": 499, "q": "", "a": "schieten op een vliegende eend boven water", "b": "met hagel schieten op een lopend haas op meter", "c": "meteen klein kaliberbuks schieten op een stilzittend konijn Welke stootvogel is een bodembroeder?", "ans": "b"}, {"n": 500, "q": "Welke stootvogel is een bodembroeder?", "a": "Sperwer", "b": "Wespendief", "c": "Blauwe kiekendief", "ans": "c"}]</script>
<script>
const QUESTIONS = JSON.parse(document.getElementById('quiz-data').textContent);
const STORAGE_KEY = 'jachtopleiding-quiz-state-v1';

let state = {
  index: 0,
  order: QUESTIONS.map((_, i) => i),
  shuffle: false,
  // map: question-original-index → { picked: 'a|b|c', checked: bool, correct: bool }
  results: {},
};

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}
}
function loadState() {
  try {
    const s = localStorage.getItem(STORAGE_KEY);
    if (s) state = Object.assign(state, JSON.parse(s));
  } catch {}
}

function currentQ() {
  const origIdx = state.order[state.index];
  return { q: QUESTIONS[origIdx], origIdx };
}

function render() {
  const { q, origIdx } = currentQ();
  const result = state.results[origIdx] || {};
  const picked = result.picked;
  const checked = !!result.checked;
  const correct = q.ans;

  document.getElementById('pos').textContent = state.index + 1;
  document.getElementById('total').textContent = QUESTIONS.length;
  const pct = ((state.index + 1) / QUESTIONS.length) * 100;
  document.getElementById('bar').style.width = pct + '%';

  let answered = 0, right = 0, wrong = 0;
  for (const k in state.results) {
    const r = state.results[k];
    if (r.checked) {
      answered++;
      if (r.correct) right++; else wrong++;
    }
  }
  document.getElementById('correct-count').textContent = right;
  document.getElementById('wrong-count').textContent = wrong;
  document.getElementById('answered-count').textContent = answered;

  const area = document.getElementById('question-area');
  const opts = ['a','b','c'];
  area.innerHTML = `
    <div class="card">
      <div class="qnum">Vraag ${q.n}</div>
      <div class="qtext">${escapeHtml(q.q)}</div>
      ${opts.map(letter => {
        const cls = ['opt'];
        if (picked === letter) cls.push('selected');
        if (checked) {
          if (letter === correct) cls.push('correct');
          else if (letter === picked) cls.push('wrong');
        }
        return `
          <label class="${cls.join(' ')}" data-letter="${letter}">
            <input type="radio" name="opt" value="${letter}" ${picked===letter?'checked':''} ${checked?'disabled':''}>
            <span class="opt-label">${letter}.</span>
            <span class="opt-text">${escapeHtml(q[letter])}</span>
          </label>
        `;
      }).join('')}
    </div>
  `;

  // attach option listeners
  area.querySelectorAll('.opt input').forEach(inp => {
    inp.addEventListener('change', e => {
      if (checked) return;
      const letter = e.target.value;
      state.results[origIdx] = Object.assign({}, state.results[origIdx], { picked: letter });
      saveState(); render();
    });
  });

  // feedback text
  const fb = document.getElementById('feedback');
  if (checked) {
    if (result.correct) {
      fb.textContent = '✓ Juist!'; fb.className = 'feedback good';
    } else {
      fb.textContent = `✗ Het juiste antwoord is ${correct.toUpperCase()}.`;
      fb.className = 'feedback bad';
    }
  } else {
    fb.textContent = ''; fb.className = 'feedback';
  }

  // button states
  document.getElementById('prev-btn').disabled = state.index === 0;
  document.getElementById('next-btn').disabled = state.index === QUESTIONS.length - 1;
  document.getElementById('check-btn').disabled = checked || !picked;
}

function check() {
  const { q, origIdx } = currentQ();
  const r = state.results[origIdx];
  if (!r || !r.picked) return;
  r.checked = true;
  r.correct = (r.picked === q.ans);
  saveState(); render();
}

function next() {
  if (state.index < QUESTIONS.length - 1) {
    state.index++; saveState(); render();
  }
}
function prev() {
  if (state.index > 0) {
    state.index--; saveState(); render();
  }
}
function jumpTo() {
  const v = parseInt(document.getElementById('jump-input').value, 10);
  if (!v || v < 1 || v > QUESTIONS.length) return;
  // find the order index for question number v
  const targetOrig = QUESTIONS.findIndex(x => x.n === v);
  if (targetOrig === -1) return;
  const targetPos = state.order.indexOf(targetOrig);
  if (targetPos === -1) return;
  state.index = targetPos; saveState(); render();
}

function toggleShuffle() {
  state.shuffle = !state.shuffle;
  if (state.shuffle) {
    const arr = QUESTIONS.map((_, i) => i);
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    state.order = arr;
  } else {
    state.order = QUESTIONS.map((_, i) => i);
  }
  state.index = 0;
  document.getElementById('shuffle-btn').textContent = 'Shuffle: ' + (state.shuffle ? 'on' : 'off');
  saveState(); render();
}

function resetAll() {
  if (!confirm('Voortgang wissen?')) return;
  state.results = {};
  state.index = 0;
  saveState(); render();
}

function showSummary() {
  let answered = 0, right = 0;
  const wrongList = [];
  const unanswered = [];
  for (let i = 0; i < QUESTIONS.length; i++) {
    const q = QUESTIONS[i];
    const r = state.results[i];
    if (r && r.checked) {
      answered++;
      if (r.correct) right++;
      else wrongList.push({ n: q.n, picked: r.picked, correct: q.ans });
    } else {
      unanswered.push(q.n);
    }
  }
  const pct = answered > 0 ? Math.round((right / answered) * 100) : 0;
  let html = `<h2>Overzicht</h2>
    <div class="score">${right} / ${answered}</div>
    <div class="score-detail">${pct}% juist · ${unanswered.length} onbeantwoord</div>`;
  if (wrongList.length) {
    html += `<div style="text-align:left; max-width:420px; margin:1rem auto 0;">
      <b>Foute vragen:</b><div style="margin-top:0.4rem; font-size:0.85rem;">${
        wrongList.map(w => `Q${w.n}: koos <b>${w.picked.toUpperCase()}</b>, juist was <b>${w.correct.toUpperCase()}</b>`).join('<br>')
      }</div></div>`;
  }
  html += `<div style="margin-top:1rem;"><button class="btn btn-secondary" onclick="render()">← Terug naar quiz</button></div>`;
  document.getElementById('question-area').innerHTML = `<div class="summary">${html}</div>`;
  document.querySelector('.actions').style.display = 'none';
}

// override render to restore actions when navigating back
const _origRender = render;
render = function() {
  document.querySelector('.actions').style.display = '';
  _origRender();
};

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[c]);
}

function toggleTheme() {
  const isDark = document.documentElement.classList.toggle('dark');
  document.getElementById('theme-toggle').textContent = isDark ? 'Light' : 'Dark';
  localStorage.setItem('quiz-theme', isDark ? 'dark' : 'light');
}

// keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowLeft') prev();
  else if (e.key === 'ArrowRight') next();
  else if (e.key === 'Enter') check();
  else if (e.key === '1' || e.key.toLowerCase() === 'a') pick('a');
  else if (e.key === '2' || e.key.toLowerCase() === 'b') pick('b');
  else if (e.key === '3' || e.key.toLowerCase() === 'c') pick('c');
});

function pick(letter) {
  const { q, origIdx } = currentQ();
  const r = state.results[origIdx] || {};
  if (r.checked) return;
  state.results[origIdx] = Object.assign({}, r, { picked: letter });
  saveState(); render();
}

// init
if (localStorage.getItem('quiz-theme') === 'dark') {
  document.documentElement.classList.add('dark');
  document.getElementById('theme-toggle').textContent = 'Light';
}
loadState();
if (state.shuffle) document.getElementById('shuffle-btn').textContent = 'Shuffle: on';
render();
</script>
</body>
</html>
